[project]
name = "asa-worker"
version = "0.1.0"
description = "AI Software Architect — async generation workers"
requires-python = ">=3.12"
dependencies = [
    "asa-shared",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
