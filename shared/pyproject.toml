[project]
name = "asa-shared"
version = "0.1.0"
description = "Code shared by the api and worker: the CPM, the LLM Gateway, and extraction."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "httpx>=0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cpm*", "llm*", "extraction*", "diagrams*", "consistency*", "generation*"]

[tool.setuptools.package-data]
cpm = ["fixtures/*.json"]

[tool.pytest.ini_options]
# Needed here as well as in api/pyproject.toml: when pytest is invoked with
# shared/tests as its argument, rootdir resolves to shared/ and the api config
# is never read — which silently turns every async test into a no-op failure.
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
