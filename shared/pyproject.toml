[project]
name = "asa-shared"
version = "0.1.0"
description = "Code shared by the api and worker: the CPM, the LLM Gateway, and extraction."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    # DOCX export. Pure Python, MIT, no system libraries — and it ships a
    # default template carrying Word's real built-in styles, which is what
    # lets the exporter apply Heading 1/Caption rather than imitate them.
    "python-docx>=1.1",
    # PDF export. Pure Python like python-docx: no cairo, no pango, no system
    # packages in the worker image. svglib draws the diagrams as real vector,
    # and canvas access is what makes the FR-20 watermark render-time rather
    # than a second pass over a finished file.
    "reportlab>=4.2",
    "svglib>=1.5",
    # PDF ingestion (P-M6-1): a project description may arrive as a PDF, and
    # reading it back out is a real dependency of extraction, not just of the
    # AT-1 equivalence test that also happens to use it.
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cpm*", "llm*", "extraction*", "diagrams*", "consistency*", "generation*", "review*", "store*", "srs*", "srs.export*", "srs.template*", "billing*", "analytics*"]

[tool.setuptools.package-data]
cpm = ["fixtures/*.json"]
billing = ["*.json", "*.sql"]
analytics = ["*.sql"]
"srs.template" = ["builtin/*.json"]

[tool.pytest.ini_options]
# Needed here as well as in api/pyproject.toml: when pytest is invoked with
# shared/tests as its argument, rootdir resolves to shared/ and the api config
# is never read — which silently turns every async test into a no-op failure.
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
