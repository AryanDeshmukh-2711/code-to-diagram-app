[project]
name = "asa-cpm"
version = "0.1.0"
description = "Canonical Project Model — the single source of truth every artefact renders from."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cpm*"]
